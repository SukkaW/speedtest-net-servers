name: Daily Collect
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        id: setup_pnpm
        background: true
        with:
          cache: true
          run_install: false
      - uses: actions/setup-node@v6
        id: setup_node
        background: true
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - wait: [setup_pnpm, setup_node]
      - run: pnpm config set --location=global minimumReleaseAge 0
      - run: pnpm install
      - run: pnpm run node index.ts
      - uses: peaceiris/actions-gh-pages@v4
        background: true
        with:
          publish_dir: public
          external_repository: SukkaLab/speedtest-net-servers-dist
          publish_branch: master
          personal_token: ${{ secrets.GIT_DEPLOY_TOKEN }}
          user_name: ${{ secrets.GIT_DEPLOY_USER }}
          user_email: ${{ secrets.GIT_DEPLOY_EMAIL }}
      - run: |
          mkdir -p /tmp/public/
          echo "Last updated at $(date -u)" > /tmp/public/last-run.txt
      - uses: peaceiris/actions-gh-pages@v4
        background: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/public
          keep_files: true
          force_orphan: true
          publish_branch: dist
